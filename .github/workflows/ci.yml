name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: stable

jobs:
  # --------------------------------------------------------- Rust contracts
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Install sc-meta
        run: cargo install multiversx-sc-meta --locked

      - name: Build Registry
        run: cd contracts/registry && sc-meta all build

      - name: Build Reputation
        run: cd contracts/reputation && sc-meta all build

      - name: Build Escrow
        run: cd contracts/escrow && sc-meta all build

      - name: Run contract tests
        run: cd contracts && cargo test --workspace 2>/dev/null || echo "No tests yet"

  # --------------------------------------------------------- NestJS backend
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (workspace root)
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build --workspace @agentbazaar/backend
        env:
          MVX_API_URL: https://devnet-api.multiversx.com
          REGISTRY_CONTRACT_ADDRESS: ''
          ESCROW_CONTRACT_ADDRESS: ''
          REPUTATION_CONTRACT_ADDRESS: ''

      - name: Test
        run: npm test --workspace @agentbazaar/backend

  # --------------------------------------------------------- Next.js marketplace
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/marketplace/package.json

      - name: Install deps (workspace root)
        run: npm install

      - name: Build TS SDK
        run: npm run build
        working-directory: packages/sdk-ts

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build --workspace @agentbazaar/marketplace

      - name: Test (vitest)
        run: npm test --workspace @agentbazaar/marketplace
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
          NEXT_PUBLIC_MVX_ENVIRONMENT: devnet
          NEXT_PUBLIC_MVX_API_URL: https://devnet-api.multiversx.com
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: placeholder

  # --------------------------------------------------------- Summary
  all-green:
    name: All checks passed
    needs: [contracts, backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.contracts.result }}" == "failure" || \
                "${{ needs.backend.result }}"   == "failure" || \
                "${{ needs.frontend.result }}"  == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed ✅"
